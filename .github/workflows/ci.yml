name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e '.[all]'

      - name: Ruff
        run: make lint

      - name: mypy
        run: make typecheck

      - name: Unit tests with coverage
        run: pytest -m 'not integration' --cov=mcp_app_suite_shared --cov=mcp_app_playground --cov=mcp_app_scaffolder --cov=examples --cov-report=term-missing

      - name: Integration tests
        run: pytest -m integration
[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-app-suite"
version = "0.1.0"
description = "Monorepo for MCP App tooling, scaffolding, and examples."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vik Udasi" }]
dependencies = []

[project.optional-dependencies]
playground = [
    "aiohttp>=3.10.0",
    "typer>=0.12.3",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "rich>=13.7.0",
]
scaffolder = [
    "jinja2>=3.1.4",
    "typer>=0.12.3",
]
examples = [
    "mcp>=1.0.0",
    "typer>=0.12.3",
]
all = [
    "aiohttp>=3.10.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "mcp>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.3",
]

[project.scripts]
mcp-app-playground = "mcp_app_playground.cli:main"
mcp-app-scaffolder = "mcp_app_scaffolder.cli:main"
mcp-app-examples = "examples.cli:main"

[tool.setuptools]
packages = [
    "mcp_app_suite_shared",
    "mcp_app_playground",
    "mcp_app_scaffolder",
    "examples",
]

[tool.setuptools.package-data]
mcp_app_scaffolder = ["templates/**/*.j2"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"examples/html_templates.py" = ["E501"]
"examples/server.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["psutil", "mcp.server.fastmcp"]
ignore_missing_imports = true

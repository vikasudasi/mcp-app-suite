[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-app-examples"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "typer>=0.12.0",
    "jinja2>=3.1.0",
    "psutil>=5.9.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
]
